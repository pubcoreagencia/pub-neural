name: python-tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip psycopg2-binary
      - name: Run abstention unit tests
        run: |
          python -m unittest discover -s tests -p 'test_abstention_policy.py' -v
          python -m unittest discover -s tests -p 'test_abstention_calibration.py' -v
